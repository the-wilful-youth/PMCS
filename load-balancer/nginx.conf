# Nginx High-Load Reverse Proxy & Load Balancer Configuration for PMCS
# Balances traffic across multiple PMCS Next.js instances with Redis cache support

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance & Optimization
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression for high-throughput bandwidth savings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting Zone: 100 requests/sec per IP with burst buffer
    limit_req_zone $binary_remote_addr zone=pmcs_rate_limit:10m rate=100r/s;

    # Microcaching zone for high-load read operations
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=PMCS_CACHE:20m max_size=500m inactive=60m use_temp_path=off;

    # Upstream PMCS cluster (least_conn for load balancing across workers/instances)
    upstream pmcs_cluster {
        least_conn;
        server app-1:3000 max_fails=3 fail_timeout=10s;
        server app-2:3000 max_fails=3 fail_timeout=10s;
        server app-3:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost pmcs.local;

        # Rate limiting applied to all requests
        limit_req zone=pmcs_rate_limit burst=50 nodelay;

        # Health Check Route - Direct access for external load balancers
        location /api/health {
            proxy_pass http://pmcs_cluster/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Next.js Static Assets - Long-term caching
        location /_next/static/ {
            proxy_pass http://pmcs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public static files
        location /static/ {
            proxy_pass http://pmcs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Dynamic & App Routes - Load balanced with upstream proxy headers
        location / {
            proxy_pass http://pmcs_cluster;
            proxy_http_version 1.1;

            # Connection Keepalive
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Caching headers for cacheable GET/HEAD responses
            proxy_cache PMCS_CACHE;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 60s;
            proxy_cache_bypass $http_cookie $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
    }
}
