version: '3.8'

services:
  # Distributed In-Memory Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: pmcs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PMCS Application Instance 1
  app-1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pmcs-app-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - NODE_APP_INSTANCE=app-1
    depends_on:
      redis:
        condition: service_healthy

  # PMCS Application Instance 2
  app-2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pmcs-app-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - NODE_APP_INSTANCE=app-2
    depends_on:
      redis:
        condition: service_healthy

  # PMCS Application Instance 3
  app-3:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pmcs-app-3
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - NODE_APP_INSTANCE=app-3
    depends_on:
      redis:
        condition: service_healthy

  # Nginx Load Balancer (Distributes incoming requests across app-1, app-2, app-3)
  load-balancer:
    image: nginx:alpine
    container_name: pmcs-load-balancer
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
      - app-3

volumes:
  redis-data:
